Created ci.yml

  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Установить зависимости
        run: npm ci

      - name: Python ленивый venv
        shell: bash
        run: |
          python -m venv venv
          .venv/Scripts/python.exe -m pip install -q --upgrade pip
          .venv/Scripts/python.exe -m pip install -q -r python/requirements.txt

      - name: Python unit тесты pytest
        shell: bash
        run: .venv/Scripts/python.exe -m pytest tests/unit -q

      - name: JavaScript unit/integration (Jest)
        run: npm test

      - name: Сборка артефактов
        if: github.event_name == 'pull_request'
        run: npx playwright install chromium --with-deps || true
