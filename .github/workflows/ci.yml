name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Настройка Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Настройка Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: python/requirements.txt

      - name: Установка Node.js зависимостей
        run: npm ci

      - name: Проверка уязвимостей Node.js
        run: npm audit --audit-level=high

      - name: Проверка форматирования публичных файлов
        run: npx prettier --check README.md CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md SUPPORT.md package.json .github docs/promotion

      - name: Установка Python зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt pytest pytest-cov pytest-asyncio pytest-mock

      - name: Проверка линтера (ESLint)
        run: npm run lint

      - name: Модульные тесты Python (pytest)
        run: python -m pytest tests/unit -v

      - name: Модульные и интеграционные тесты JavaScript (Jest)
        run: npm test
