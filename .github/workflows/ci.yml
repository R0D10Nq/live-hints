name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Настройка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: python/requirements.txt

      - name: Установка Node.js зависимостей
        run: npm ci

      - name: Установка Python зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt pytest pytest-cov pytest-asyncio pytest-mock

      - name: Проверка линтера (ESLint)
        run: npm run lint

      - name: Модульные тесты Python (pytest)
        run: python -m pytest tests/unit -v

      - name: Модульные и интеграционные тесты JavaScript (Jest)
        run: npm test
