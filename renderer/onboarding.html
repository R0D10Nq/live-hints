<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Hints — Настройка</title>
    <style>
      /* ===== RESET & BASE ===== */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #0f1117;
        --surface: #1a1d26;
        --elevated: #242836;
        --accent: #6c5ce7;
        --accent-bright: #8577ff;
        --accent-dim: rgba(108, 92, 231, 0.15);
        --success: #22c55e;
        --error: #ef4444;
        --text: #f1f5f9;
        --text-secondary: #94a3b8;
        --muted: #64748b;
        --border: rgba(255, 255, 255, 0.08);
        --radius: 12px;
        --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      }

      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ===== HEADER ===== */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 24px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        -webkit-app-region: drag;
        user-select: none;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        font-size: 18px;
      }

      .logo-mark {
        width: 28px;
        height: 28px;
        background: linear-gradient(135deg, var(--accent), var(--accent-bright));
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 900;
      }

      .window-btns {
        display: flex;
        gap: 8px;
        -webkit-app-region: no-drag;
      }

      .win-btn {
        width: 28px;
        height: 28px;
        border: none;
        background: transparent;
        color: var(--text-secondary);
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        -webkit-app-region: no-drag;
      }
      .win-btn:hover {
        background: var(--elevated);
      }
      .win-btn.close:hover {
        background: var(--error);
        color: white;
      }

      /* ===== MAIN ===== */
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        overflow-y: auto;
      }

      .wizard {
        width: 100%;
        max-width: 660px;
      }

      /* ===== STEPS INDICATOR ===== */
      .steps {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 24px;
        margin-bottom: 40px;
      }

      .step-dot {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        opacity: 0.35;
        transition: all 0.3s;
      }
      .step-dot.active {
        opacity: 1;
      }
      .step-dot.done {
        opacity: 0.6;
      }

      .dot-num {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--elevated);
        border: 2px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 14px;
        transition: all 0.3s;
      }
      .step-dot.active .dot-num {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
        box-shadow: 0 0 20px var(--accent-dim);
      }
      .step-dot.done .dot-num {
        background: var(--success);
        border-color: var(--success);
        color: white;
      }

      .step-label {
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .step-dot.active .step-label {
        color: var(--accent-bright);
      }

      /* ===== CARD ===== */
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 40px;
      }

      .badge {
        display: inline-block;
        padding: 4px 12px;
        background: var(--accent-dim);
        color: var(--accent-bright);
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 16px;
      }

      h2 {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 8px;
      }

      .subtitle {
        color: var(--text-secondary);
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 32px;
      }

      /* ===== MODE CARDS ===== */
      .mode-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
      }

      .mode-card {
        background: var(--elevated);
        border: 2px solid var(--border);
        border-radius: var(--radius);
        padding: 20px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .mode-card:hover {
        border-color: rgba(108, 92, 231, 0.4);
        transform: translateY(-2px);
      }
      .mode-card.sel {
        border-color: var(--accent);
        background: var(--accent-dim);
      }

      .mode-icon {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        background: var(--surface);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 14px;
        color: var(--accent-bright);
        transition: all 0.2s ease;
      }
      .mode-card:hover .mode-icon {
        background: var(--accent);
        border-color: var(--accent);
        color: #ffffff;
      }
      .mode-card.sel .mode-icon {
        background: var(--accent);
        border-color: var(--accent);
        color: #ffffff;
      }
      .mode-icon svg {
        width: 22px;
        height: 22px;
      }
      .mode-name {
        font-weight: 600;
        font-size: 15px;
        margin-bottom: 4px;
      }
      .mode-desc {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.4;
      }

      /* ===== UPLOAD ZONE ===== */
      .upload-zone {
        border: 2px dashed var(--border);
        border-radius: var(--radius);
        padding: 40px 24px;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s;
        background: var(--elevated);
      }
      .upload-zone:hover {
        border-color: var(--accent);
        background: var(--accent-dim);
      }

      .upload-icon {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: var(--surface);
        border: 1px solid var(--border);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 16px;
        color: var(--accent-bright);
      }
      .upload-icon svg {
        width: 28px;
        height: 28px;
      }
      .finish-icon {
        width: 72px;
        height: 72px;
        border-radius: 20px;
        background: var(--accent-dim);
        border: 2px solid var(--accent);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        color: var(--accent-bright);
      }
      .finish-icon svg {
        width: 36px;
        height: 36px;
      }
      .upload-title {
        font-weight: 600;
        font-size: 15px;
        margin-bottom: 8px;
      }
      .upload-hint {
        font-size: 12px;
        color: var(--muted);
      }

      /* ===== TEXTAREA AREA ===== */
      .text-input {
        width: 100%;
        min-height: 120px;
        background: var(--elevated);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text);
        font-family: var(--font);
        font-size: 14px;
        line-height: 1.6;
        padding: 12px 16px;
        resize: vertical;
      }
      .text-input:focus {
        outline: none;
        border-color: var(--accent);
      }

      /* ===== AUDIO SECTION ===== */
      .audio-visualizer {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 4px;
        height: 100px;
        background: var(--elevated);
        border-radius: var(--radius);
        padding: 20px 16px;
        margin-bottom: 20px;
      }

      .wave {
        width: 6px;
        background: linear-gradient(to top, var(--accent), var(--accent-bright));
        border-radius: 3px;
        height: 20%;
        opacity: 0.6;
      }

      select.form-select {
        width: 100%;
        padding: 12px 16px;
        background: var(--elevated);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text);
        font-family: var(--font);
        font-size: 14px;
        margin-bottom: 16px;
      }

      /* ===== FOOTER NAV ===== */
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 24px;
        background: var(--surface);
        border-top: 1px solid var(--border);
      }

      .step-counter {
        font-size: 13px;
        color: var(--muted);
      }

      .btn-row {
        display: flex;
        gap: 10px;
      }

      .btn {
        padding: 10px 20px;
        border-radius: var(--radius);
        font-family: var(--font);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        transition: all 0.2s;
      }
      .btn-ghost {
        background: transparent;
        color: var(--text-secondary);
        border: 1px solid var(--border);
      }
      .btn-ghost:hover {
        background: var(--elevated);
        color: var(--text);
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-bright));
        color: white;
      }
      .btn-primary:hover:not(:disabled) {
        opacity: 0.9;
        transform: translateY(-1px);
      }
      .btn-primary:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* ===== UTILITY ===== */
      .hidden {
        display: none !important;
      }
      input[type='file'] {
        display: none;
      }

      .meta-link {
        display: inline-block;
        margin-top: 12px;
        font-size: 13px;
        color: var(--accent-bright);
        cursor: pointer;
        background: none;
        border: none;
        padding: 0;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <!-- HEADER -->
    <header class="header">
      <div class="logo">
        <div class="logo-mark">LH</div>
        <span>Live Hints</span>
      </div>
      <div class="window-btns">
        <button class="win-btn" id="btnMin">−</button>
        <button class="win-btn close" id="btnClose">×</button>
      </div>
    </header>

    <!-- MAIN -->
    <main>
      <div class="wizard">
        <!-- STEPS INDICATOR -->
        <div class="steps" id="stepIndicator"></div>

        <!-- STEP CARD -->
        <div class="card" id="stepCard">
          <!-- Dynamic content injected here -->
        </div>
      </div>
    </main>

    <!-- FOOTER NAV -->
    <footer class="footer">
      <button class="btn btn-ghost" id="btnBack">← Назад</button>
      <span class="step-counter">
        <span id="curStep">1</span> / <span id="totalSteps">3</span>
      </span>
      <div class="btn-row">
        <button class="btn btn-ghost hidden" id="btnSkip">Пропустить →</button>
        <button class="btn btn-primary" id="btnNext">Далее →</button>
        <button class="btn btn-success hidden" id="btnFinish">Запустить ✓</button>
      </div>
    </footer>

    <script type="module" src="onboarding.js"></script>
  </body>
</html>
